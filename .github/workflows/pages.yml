name: Pages

# Publishes the dashboard at the site root and the documentation under /docs/.
# In the repository settings, Pages must use "GitHub Actions" as its source.

on:
  push:
    branches: [main]
    paths: ["docs/**", "dashboard/**", "mkdocs.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Documentation
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict --site-dir _site/docs
      - name: Dashboard
        run: |
          cp -r dashboard/. _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
