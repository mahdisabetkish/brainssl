name: Docker

# Builds the CPU and GPU training images and the small Rust inference image,
# smoke-tests them without network access, and pushes them to Docker Hub.
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN; without
# them the images are still built and tested, just not pushed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["Dockerfile", "docker/**", "requirements*.txt", "rust/**"]
  workflow_dispatch:

env:
  REPO: ${{ vars.DOCKERHUB_REPO || 'mahdisabetkish/brainssl' }}
  HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  training-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: cpu
            torch: cpu
          - variant: gpu
            torch: cu126
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the CUDA image
        if: matrix.variant == 'gpu'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: TORCH_VARIANT=${{ matrix.torch }}
          load: true
          tags: brainssl:${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Smoke test, offline
        run: |
          docker run --rm --network none brainssl:${{ matrix.variant }} info
          docker run --rm --network none brainssl:${{ matrix.variant }} brainssl --help
      - name: Log in to Docker Hub
        id: login
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push
        if: steps.login.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: TORCH_VARIANT=${{ matrix.torch }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REPO }}:${{ matrix.variant }}
            ${{ matrix.variant == 'cpu' && format('{0}:latest', env.REPO) || format('{0}:gpu', env.REPO) }}
          cache-from: type=gha,scope=${{ matrix.variant }}

  inference-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch the exported models from the Hugging Face Hub
        run: |
          pip install huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download
          for repo, local in [("mahdisabetkish/brainssl-tumour-segmentation", "exports/segmentation"),
                              ("mahdisabetkish/brainssl-abide-connectome", "exports/connectome")]:
              try:
                  snapshot_download(repo, local_dir=local, allow_patterns=["*.onnx", "*.json", "*.bin"])
              except Exception as err:
                  print(f"{repo}: {err}")
          PY
          mkdir -p exports
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          load: true
          tags: brainssl-infer:latest
          cache-from: type=gha,scope=infer
          cache-to: type=gha,mode=max,scope=infer
      - name: Smoke test
        run: docker run --rm --network none brainssl-infer:latest --help
      - name: Log in to Docker Hub
        id: login
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push
        if: steps.login.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          push: true
          tags: ${{ env.REPO }}-infer:latest
          cache-from: type=gha,scope=infer
