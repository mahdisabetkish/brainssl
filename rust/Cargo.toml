[package]
name = "brainssl-infer"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
nalgebra = "0.35.0"
ndarray = "0.17.2"
nifti = "0.18.0"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "ndarray"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
